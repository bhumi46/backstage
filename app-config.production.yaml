# Layered on app-config.yaml when Backstage runs in the kind cluster (step 4e; see charts/backstage).
# Arrays here REPLACE the ones in app-config.yaml (catalog.locations, clusterLocatorMethods).
# Secrets come from the Kubernetes Secret backstage-secrets (scripts/cluster-secrets.sh), never from git.

# Reached with `kubectl -n backstage port-forward svc/backstage 7007:7007`. Same port as local dev,
# so the GitHub OAuth app callback (http://localhost:7007/api/auth/github/handler/frame) still works.
# The backend serves the frontend, so app and backend share one origin.
app:
  baseUrl: http://localhost:7007

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  cors:
    origin: http://localhost:7007
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
  # Static token so scripts (and the step 4e checks) can call the API, same as app-config.local.yaml.
  auth:
    externalAccess:
      - type: static
        options:
          token: ${BACKSTAGE_TEST_TOKEN}
          subject: local-test-script

auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

# The image has no repo checkout, so read org, repo list and templates from GitHub.
# Template skeletons are resolved relative to the template URL.
catalog:
  locations:
    - type: url
      target: https://github.com/bhumi46/backstage/blob/main/catalog/org.yaml
      rules:
        - allow: [Group, User, System]
    - type: url
      target: https://github.com/bhumi46/backstage/blob/main/catalog/locations.yaml
    - type: url
      target: https://github.com/bhumi46/backstage/blob/main/templates/new-go-service/template.yaml
      rules:
        - allow: [Template]
    - type: url
      target: https://github.com/bhumi46/backstage/blob/main/templates/new-environment/template.yaml
      rules:
        - allow: [Template]

# Argo CD API through the in-cluster service of the "argo-cd" Helm release (server.insecure: plain HTTP on 80).
# argocd.baseUrl stays http://localhost:8080 (app-config.yaml) for links you open in the browser.
proxy:
  endpoints:
    '/argocd/api':
      target: http://argo-cd-argocd-server.argocd.svc/api/v1/
      changeOrigin: true
      headers:
        Authorization: Bearer ${ARGOCD_AUTH_TOKEN}

# In the pod: no token configured, so the plugin uses the pod's own ServiceAccount
# (backstage-reader, read-only ClusterRole from platform-infra) and the mounted CA.
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: idp-lab
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          skipMetricsLookup: true

techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local
