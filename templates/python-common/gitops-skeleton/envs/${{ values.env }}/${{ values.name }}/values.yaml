image:
  # First commit of the new repo; CI bumps dev from here on after this PR is merged.
  tag: ${{ values.imageTag }}
replicaCount: 1
env:
  LOG_LEVEL: info
{%- if values.dependsOn %}
{%- set dep = values.dependsOn | parseEntityRef | pick('name') %}
  ${{ dep | upper | replace('-', '_') }}_URL: http://${{ dep }}.${{ values.env }}.svc.cluster.local
{%- endif %}
