[project]
name = "${{ values.name }}"
version = "0.1.0"
description = ${{ values.description | dump }}
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django==5.2.19",
    "djangorestframework==3.18.3",
    "django-environ==0.14.0",
    "django-stubs-ext==6.1.2",
    "django-prometheus==2.5.0",
    "prometheus-client==0.26.0",
    "whitenoise==6.12.0",
    "gunicorn==27.0.0",
    "psycopg[binary]==3.3.8",
    "python-json-logger==4.2.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "mypy==2.4.1",
    "django-stubs==6.1.2",
    "djangorestframework-stubs==3.18.2",
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
]

[tool.uv]
# An application, not a library: dependencies only, code runs from src/ (PYTHONPATH).
package = false
# Reproducible resolution: ignore anything published after this date (bump deliberately).
exclude-newer = "2026-11-11T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["src/apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "DJ", "PT", "N", "C4", "DTZ", "T20", "PL", "PTH"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"src/config/settings/*.py" = ["F403", "F405"]
"src/config/settings/test.py" = ["F403", "F405", "S105"]  # dummy key for tests only
# Deliberate late imports: sys.path / env must be set first; prometheus only in the server.
"manage.py" = ["PLC0415"]
"gunicorn.conf.py" = ["PLC0415"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests", "manage.py", "gunicorn.conf.py"]
exclude = ["src/apps/.*/migrations/"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
module = ["environ.*", "django_prometheus.*", "gunicorn.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=85"
# collectstatic only runs in the image build, so WhiteNoise has no directory under tests.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
omit = ["src/apps/*/migrations/*", "src/config/asgi.py", "src/config/wsgi.py"]
